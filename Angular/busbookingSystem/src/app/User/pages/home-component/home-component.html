<app-header-component></app-header-component>
<!-- <p class="mt-5 text-center mb-5">home-component works!</p> -->


<!-- Hero Section -->
<section class="hero">
  <h1>Book Bus Tickets</h1>
  <form class="p-5">

    <select name="fromCity" [(ngModel)]="fromCity" class="w-100 p-2 mb-4">
      <option value="">From</option>
      <option>Ahmedabad</option>
      <option>Surat</option>
      <option>Vadodara</option>
      <option>Rajkot</option>
      <option>Bhavnagar</option>
      <option>Jamnagar</option>
      <option>Junagadh</option>
      <option>Anand</option>
      <option>Gandhinagar</option>
      <option>Mehsana</option>
    </select>

    <select name="toCity" [(ngModel)]="toCity" class="w-100 p-2 mb-4">
      <option value="">To</option>
      <option>Ahmedabad</option>
      <option>Surat</option>
      <option>Vadodara</option>
      <option>Rajkot</option>
      <option>Bhavnagar</option>
      <option>Jamnagar</option>
      <option>Junagadh</option>
      <option>Anand</option>
      <option>Gandhinagar</option>
      <option>Mehsana</option>
    </select>

    <select name="passengers" [(ngModel)]="passengers" class="w-100 p-2 mb-4">
      <option value="">Passengers</option>
      <option value="1">1 Passenger</option>
      <option value="2">2 Passengers</option>
      <option value="3">3 Passengers</option>
      <option value="4">4 Passengers</option>
      <option value="5">5 Passengers</option>
    </select>
    
    <input type="submit" (click)="searchBus()" value="Search Buses" />
  </form>

  
</section>

<!-- RESULT -->
<div *ngIf="busList.length > 0">
  <h2 class="text-center border p-3 mb-4" style="margin-top: -120px;">Available Buses</h2>

  <div class="container " style="display:flex;justify-content: center;">
    <div *ngFor="let bus of busList" class="card bus-card m-4" style="width: 18rem; ">
      <img src="{{bus.img}}" width="100%" height="100%" class="card-img-top" alt="...">
      <div class="card-body">
        <h5 class="card-title text-center m-2 border p-2">{{ bus.name }}</h5>
        <p class="card-text text-center m-2 border p-2">{{ bus.from }} → {{ bus.to }}</p>
        <p class="card-text text-center m-2 border p-2">Time: {{ bus.time }}</p>
        <p class="card-text text-center m-2 border p-2">Seats: {{ bus.seats }}</p>
        <p class="card-text text-center m-2 border p-2">Price: ₹{{ bus.price }}</p>
        <div class="mt-3 border p-2 text-center">
          <a href="#" class="btn btn-success p-1 ms-3 ps-3 pe-3">Add </a>
          <a href="#" class="btn btn-primary  p-1 ms-3 ps-3 pe-3">Cancel </a>
        </div>
      </div>
    </div>
  </div>

  

  <p *ngIf="busList.length === 0 && searched">
     Bus not found
  </p>

  <app-footer-component></app-footer-component>

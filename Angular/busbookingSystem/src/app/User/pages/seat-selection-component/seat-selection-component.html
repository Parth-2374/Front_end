<h2>{{ bus?.name }} - Seat Selection</h2>

<div class="seat-container">
  <div
    class="seat"
    *ngFor="let seat of seats"
    [class.booked]="bus?.bookedSeats.includes(seat)"
    [class.selected]="selectedSeats.includes(seat)"
    (click)="toggleSeat(seat)"
  >
    {{ seat }}
  </div>
</div>

<p>Selected Seats: {{ selectedSeats }}</p>

<button (click)="bookSeats()" [disabled]="selectedSeats.length === 0">
  Book Seats
</button>

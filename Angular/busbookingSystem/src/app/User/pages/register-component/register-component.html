
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animated Multiple Forms</title>

<style>
:root {
  --primary: #6c63ff;
  --bg: #0f1020;
  --glass: rgba(255,255,255,0.12);
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #1b1d4f, #0f1020);
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  width: 360px;
  position: relative;
  /* top: -200px; */
}

.card {
  background: var(--glass);
  backdrop-filter: blur(16px);
  border-radius: 18px;
  padding: 30px;
  box-shadow: 0 30px 80px rgba(0,0,0,.4);
  position: absolute;
  width: 100%;
  opacity: 0;
  transform: scale(0.9);
  pointer-events: none;
  transition: all .5s ease;
}

.card.active {
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}

h2 {
  text-align: center;
  color: #fff;
  margin-bottom: 20px;
  
}

.field {
  position: relative;
  margin-bottom: 18px;
}

.field input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.15);
  color: #fff;
}

.field label {
  position: absolute;
  top: 50%;
  left: 12px;
  color: #ccc;
  transform: translateY(-50%);
  font-size: 14px;
  pointer-events: none;
  transition: .3s;
}

.field input:focus + label,
.field input:not(:placeholder-shown) + label {
  top: -6px;
  font-size: 12px;
  color: var(--primary);
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: var(--primary);
  color: #fff;
  font-size: 15px;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(108,99,255,.5);
}

.links {
  margin-top: 15px;
  text-align: center;
}

.links span {
  color: #aaa;
  cursor: pointer;
  font-size: 13px;
  margin: 0 5px;
}

.links span:hover {
  color: #fff;
}
</style>
</head>

<body>

    
<div class="container">
  <!-- Register -->
  <form (ngSubmit)="registerUser()">
    <h2>Register</h2>

    <div class="field">
      <input type="text" required placeholder=" "  name="name" [(ngModel)]="name">
      <label> Name</label>
    </div>

    <div class="field">
      <input type="email" required placeholder=" " name="email" [(ngModel)]="email">
      <label>Email</label>
    </div>

    <div class="field">
      <input type="password" required placeholder=" "name="password" [(ngModel)]="password">
      <label>Password</label>
    </div>
    

    <button type="submit"  >Create Account</button>

    <div class="links">
      <span routerLink="/login">Already have an account?</span>
    </div>
  </form>

</div>

<script>
function show(id) {
  document.querySelectorAll('.card').forEach(card => {
    card.classList.remove('active');
  });
  document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>View Appointments</title>
   <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <header>
            <h2 >Appointments</h2>
            <div class="back-div">
                <a class="back" href="index.html">← Back to Form</a>
            </div>
        </header>

        <div class="card">
            <div class="controls">
                <input id="searchInput" type="search" placeholder="Search by name or date (YYYY-MM-DD)"
                    aria-label="Search appointments" />
                <button id="refreshBtn">Refresh</button>
            </div>

            <div id="tableArea"></div>
        </div>
    </div>

    <script type="module">
        import { getItem, removeById } from "./storageUtils.js";

        class AppointmentViewer {
            constructor(tableAreaEl) {
                this.tableArea = tableAreaEl;
                this.searchInput = document.getElementById("searchInput");
                this.refreshBtn = document.getElementById("refreshBtn");
                this.data = [];
                this.addListeners();
                this.load();
            }

            addListeners() {
                this.searchInput.addEventListener("input", () => this.renderFiltered());
                this.refreshBtn.addEventListener("click", () => this.load());
            }

            load() {
                this.data = getItem();
                this.renderTable(this.data);
            }

            renderFiltered() {
                const q = this.searchInput.value.trim().toLowerCase();
                if (!q) return this.renderTable(this.data);

                const filtered = this.data.filter(item => {
                    const name = (item.name || "").toLowerCase();
                    const date = (item.date || "").toLowerCase();
                    return name.includes(q) || date.includes(q);
                });

                this.renderTable(filtered);
            }

            renderTable(arr) {
                if (!arr || arr.length === 0) {
                    this.tableArea.innerHTML = '<div class="no-data">No applications found</div>';
                    return;
                }

                const rows = arr.map(item => {
                    return `
            <tr data-id="${item.id}">
              <td><strong>${escapeHtml(item.name)}</strong><br/><small>${escapeHtml(item.email)} • ${escapeHtml(item.phone)}</small></td>
              <td>${escapeHtml(item.date)} ${escapeHtml(item.time)}</td>
              <td>${escapeHtmlShort(item.comment, 80)}</td>
              <td><span class="badge">Created</span></td>
              <td><button class="btn-danger" data-action="delete" data-id="${item.id}">Delete</button></td>
            </tr>
          `;
                }).join("");

                this.tableArea.innerHTML = `
          <table>
            <thead><tr>
              <th>Applicant</th>
              <th>Appointment</th>
              <th>Comment</th>
              <th>Status</th>
              <th>Action</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        `;

      
                this.tableArea.querySelector("tbody").addEventListener("click", (e) => {
                    const btn = e.target.closest("button[data-action='delete']");
                    if (!btn) return;
                    const id = btn.getAttribute("data-id");
                    if (!id) return;
                    if (!confirm("Delete this appointment?")) return;
                    const removed = removeById(id);
                    if (removed) {
                        this.load();
                    } else {
                        alert("Failed to delete.");
                    }
                });
            }
        }

        // small helpers
        function escapeHtml(s = "") {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
        function escapeHtmlShort(text = "", limit = 80) {
            const t = escapeHtml(text);
            if (t.length <= limit) return t;
            return t.slice(0, limit) + "...";
        }

        // instantiate viewer
        const tableAreaEl = document.getElementById("tableArea");
        new AppointmentViewer(tableAreaEl);

    </script>
</body>

</html>

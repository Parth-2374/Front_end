<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">
        <div class="row  mt-4">

        </div>
    </div>
    <script>
        fetch("https://dummyjson.com/products", {
            method: "GET"
        })
            .then((res) => {
                return res.json()
            })
            .then((sus) => {
                console.log(sus);
                sus.products.forEach((data, index) => {
                    console.log(data);

                    let html = `
                    <div class =" col-md-4 g-5 ">
                <div class="card h-100">
                 <img src="${data.images[0]}" class="card-img-top object-fit:cover;" alt="...">
                 <div class="card-body">
                 <h5 class="card-title text-center">${data.id}</h5>
                 <h5 class="card-title">${data.title}</h5>
                 <p class="card-text">${data.description.slice(0,100)}...</p>
                 <h5 class="card-title">${data.price}</h5>
                 <a href="#" class="btn btn-success">Buy Now</a>
                 <a href="#" class="btn btn-primary">Add To Cart</a>
                  </div>
                  </div> 
                  </div> 

                
                
                `
                  document.querySelector(".row").innerHTML += html
                });
            })
    </script>
</body>

</html>

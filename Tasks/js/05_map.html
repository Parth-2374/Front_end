<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table border="6px">
        <thead>
            <tr>
                <th>id</th>
                <th>name</th>
                <th>Email</th>
                <th>City</th>
                <th>universityname</th>
                <th>department</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <script>
        fetch("https://dummyjson.com/users", {
            method: "GET"
        })
            .then((res) => {
                return res.json()
            })
            .then((sus) => {
                console.log(sus)
                // sus.users.forEach((data,index) => {
                //     console.log(data)
                // });
                for (let index = 0; index < sus.users.length; index++) {
                    let data = sus.users[index];
                    console.log(data)

                    let tbody = document.querySelector("tbody")

                    let trow =tbody.insertRow()
                    let idcell= trow.insertCell(0)
                    let namecell=trow.insertCell(1)
                    let emailcell=trow.insertCell(2)
                    let citycell=trow.insertCell(3)
                    let universitycell=trow.insertCell(4)
                    let departmentcell=trow.insertCell(5)

                    idcell.textContent=data.id
                    namecell.textContent=data.firstName
                    emailcell.textContent=data.email
                    citycell.textContent=data.address.city
                    universitycell.textContent=data.university
                    departmentcell.textContent=data.company.department
                }
            })
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
        <style>
            .card {
                display: flex;
                flex-direction: column;
            }
        
            .card-body {
                display: flex;
                flex-direction: column;
                flex-grow: 1; 
            }
        
            .card-body a {
                margin-top: auto;   /* Button always bottom */
            }
        </style>
        
        
</head>

<body>
    <div class="container">
        <div class="row mt-5">

        </div>
    </div>
    <script>
        fetch("https://dummyjson.com/recipes", {
            method: "GET"
        })
            .then((res) => {
                return res.json()
            })
            .then((sus) => {
                console.log(sus);
               
                sus.recipes.forEach((data, index) => {
                    console.log(data)
                    let user = `
                    
                    <div class=" col-md-4  g-5 mb-5" >
                    <div class="card h-75 "  >
                <img src="${data.image}" class="card-img-top "style="object-fit:cover;" alt="...">
                <div class="card-body">
                <h5 class="card-title text-center">${data.name}</h5>
                <h5 class="card-title">${data.tags}</h5>
                <p class="card-text">${data.ingredients}</p>
                <h5 class="card-title">Rating:-${data.rating}</h5>
                <a href="#" class="btn btn-success my-auto">Buy Now</a>
                </div>
                </div>
                 </div>
                    
                    
                    `
                    document.querySelector(".row").innerHTML += user
                });
            })
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table border="10">
        <thead>
            <tr>
                <th>id</th>
                <th>Username</th>
                <th>Password</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    
    <script>
        fetch("https://fakestoreapi.com/users", {
            method: "GET"
        })
            .then((a) => {
                return a.json()
            })
            .then((b) => {
                console.log(b)
                b.forEach((data, index) => {
                    console.log(data)

                    let tbody = document.querySelector("tbody")

                    let trow = tbody.insertRow()
                    let idcell = trow.insertCell(0)
                    let usernamecell = trow.insertCell(1)
                    let passwordcell = trow.insertCell(2)

                    idcell.textContent = data.id
                    usernamecell.textContent = data.username
                    passwordcell.textContent = data.password
                });

              
            })
    </script>
</body>

</html>

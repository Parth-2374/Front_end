<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login with CAPTCHA</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: #fff;
      padding: 25px;
      width: 300px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
    }

    canvas {
      border: 1px solid #ccc;
      margin: 10px 0;
    }

    button {
      padding: 8px;
      width: 100%;
      cursor: pointer;
    }

    .refresh {
      background: none;
      border: none;
      color: blue;
      cursor: pointer;
      margin-bottom: 10px;
    }

    #msg {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h3>Login</h3>

    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>

    <canvas id="captchaCanvas" width="200" height="60"></canvas>
    <button class="refresh" onclick="generateCaptcha()">↻ Refresh CAPTCHA</button>

    <input type="text" id="captchaInput" placeholder="Enter CAPTCHA">

    <button onclick="login()">Login</button>

    <p id="msg"></p>
  </div>

  <script>
    let captchaText = "";

    function generateCaptcha() {
      const canvas = document.getElementById("captchaCanvas");
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#f2f2f2";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789";
      captchaText = "";

      for (let i = 0; i < 4; i++) {
        captchaText += chars.charAt(Math.floor(Math.random() * chars.length));
      }

      ctx.font = "30px Arial";
      ctx.fillStyle = "#000";

      for (let i = 0; i < captchaText.length; i++) {
        ctx.save();
        ctx.translate(40 * i + 25, 40);
        ctx.rotate((Math.random() - 0.5) * 0.5);
        ctx.fillText(captchaText[i], 0, 0);
        ctx.restore();
      }

      // Noise
      for (let i = 0; i < 5; i++) {
        ctx.strokeStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath();
        ctx.moveTo(Math.random() * 200, Math.random() * 60);
        ctx.lineTo(Math.random() * 200, Math.random() * 60);
        ctx.stroke();
      }
    }

    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const captchaInput = document.getElementById("captchaInput").value;
      const msg = document.getElementById("msg");

      if (!email || !password) {
        msg.style.color = "red";
        msg.innerText = "❌ Email & Password required";
        return;
      }

      if (captchaInput !== captchaText) {
        msg.style.color = "red";
        msg.innerText = "❌ Wrong CAPTCHA";
        generateCaptcha();
        return;
      }

      msg.style.color = "green";
      msg.innerText = "✅ Login Successful (Demo)";
    }

    generateCaptcha();
  </script>

</body>
</html>
